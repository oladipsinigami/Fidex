name: Daily Operational Check

on:
  schedule:
    # 06:00 UTC daily.
    - cron: "0 6 * * *"
  workflow_dispatch:

# Read-only. The previous version granted contents:write so it could commit
# data/arcgrade.db, but that file is gitignored and the store is remote
# (Turso) in production, so the commit step was a no-op. The watchdog writes to
# the FIDEX_DB_PATH / TURSO_DATABASE_URL store, never to a committed file.
permissions:
  contents: read

jobs:
  operational-check:
    name: Chain liveness and telemetry drift
    runs-on: ubuntu-latest

    env:
      FIDEX_DB_PATH: ${{ github.workspace }}/.tmp/fidex.db
      FIDEX_NETWORK: mainnet

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Node 24: refresh-telemetry.mjs uses node:sqlite via @libsql/client.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run the operational watchdog
        # Fails closed: an unreachable Arc RPC records everything as unverified
        # and exits non-zero, which surfaces the outage instead of hiding it.
        run: npm run verify:watchdog

      - name: Report TVL and bytecode drift
        # Drift is a review trigger, not a failure. It prints the list and
        # exits zero so the run stays green while the finding stays visible.
        run: npm run verify:drift
