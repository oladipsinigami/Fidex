name: Fidex CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and Audit Suite
    runs-on: ubuntu-latest

    env:
      # Deliberately minimal.
      #
      # A 0x-prefixed 40-hex address in this job-level env block makes GitHub
      # reject the whole workflow: the run is created, reports the file path
      # instead of the workflow name, and fails with zero jobs, so nothing ever
      # runs. Isolated by bisection -- an unrelated key with the same value
      # fails identically, and a non-address value under the same key succeeds.
      #
      # It is also unnecessary. Every suite sets its own seller address when it
      # spawns the server under test, so the literal bought nothing except a
      # published address and a broken pipeline.
      ARCGRADE_SECRET: ci-test-secret-not-a-real-credential
      ARCGRADE_NETWORK: testnet

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Node 24, not 20. The suites use node:sqlite (DatabaseSync) and
      # --experimental-strip-types, neither of which exists on Node 20. The
      # engines field in package.json declares the same floor.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Assert the required Node version
        run: node -e "const [a,b]=process.versions.node.split('.').map(Number); if(a<24) { console.error('need Node >=24, got '+process.versions.node); process.exit(1) } console.log('node '+process.versions.node)"

      - name: Lint
        run: npm run lint

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      # contracts/lib is gitignored: the vendored Foundry dependencies are
      # third-party source and does not belong in this repository. But
      # .gitmodules exists without the paths registered as gitlinks, so
      # `submodules: recursive` is a no-op and a fresh checkout has no libs.
      #
      # Plain clones at pinned tags rather than `forge install`, for two
      # reasons: foundry.lock keys its entries with Windows separators
      # ("lib\\forge-std") so forge on Linux matches nothing, and `forge
      # install` also failed outright against the nightly toolchain. Cloning
      # removes both problems. forge generates its own remappings from lib/.
      - name: Install Foundry dependencies
        run: |
          mkdir -p contracts/lib
          git clone --depth 1 --branch v1.16.2 https://github.com/foundry-rs/forge-std.git contracts/lib/forge-std
          git clone --depth 1 --branch v5.7.0 https://github.com/OpenZeppelin/openzeppelin-contracts.git contracts/lib/openzeppelin-contracts
          ls contracts/lib

      - name: Run Foundry smart contract tests
        run: npm run test:contracts

      - name: Test rating mathematical formulas
        run: npm run test:grade

      - name: Verify payment pipeline and fail-closed security
        run: npm run verify:payments

      - name: Verify on-chain settlement and calldata decoding
        run: npm run verify:onchain

      - name: Verify x402 specification compliance
        run: npm run verify:challenge

      - name: Verify EIP-712 analyst attestations
        run: npm run test:attest

      - name: Assert the freshness clock cannot be advanced by automation
        run: npm run test:freshness

      - name: Build Next.js application
        run: npm run build

      # The build above runs with no secret and no public URL, which is the
      # point: `next build` sets NODE_ENV=production, and a guard that throws
      # there would break the build instead of catching a bad deployment. This
      # asserts the build passes and the runtime still refuses.
      - name: Production guards fail at runtime, not at build
        run: npm run test:prodguard

      # check-ssr-leak.mjs boots its own production server on its own port and
      # waits for readiness, so no server is started here. A previous version
      # ran `npm run start -p 3000 &` with `sleep 4`, which passes -p to npm
      # rather than to next and does not wait long enough for a production
      # build to bind.
      - name: Zero-leak gate on SSR paywall boundaries
        run: npm run verify:leak
